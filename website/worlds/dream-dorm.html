<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream College Dorm</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../style.css">

<style>

html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    margin: 0;
    padding: 0;
    overflow: hidden;

    width: 100%;
    height: 100%;
}

.world-page {
    width: 100vw;
    height: 100vh;

    background-image: url('../images/dream-dorm.png');
    background-size: cover;
    background-position: center;

    position: relative;
}

.world-page::before { content: '';

    position: absolute;
    inset: 0;

    background:
    linear-gradient(
        rgba(0,0,0,0.25),
        rgba(0,0,0,0.35)
    );

    pointer-events: none;
}

.top-bar {
    position: absolute;
    top: 24px;
    left: 24px;
    right: 24px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 100;
}

.back-btn {
    color: white;
    text-decoration: none;

    backdrop-filter: blur(10px);

    background: rgba(255,255,255,0.12);

    padding: 12px 18px;

    border-radius: 20px;

    font-family: Inter, sans-serif;
}

.stats {
    display: flex;
    gap: 12px;
}

.stat {
    background: rgba(255,255,255,0.12);

    backdrop-filter: blur(12px);

    color: white;

    padding: 12px 18px;

    border-radius: 20px;

    font-family: Inter, sans-serif;
}

.center-content {
    position: absolute;

    inset: 0;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 10;

    color: white;
}

.world-title {
    max-width: 900px;
    line-height: 0.95;
    font-family: 'Cormorant Garamond', serif;

    font-size: clamp(42px, 6vw, 72px);

    margin-bottom: 12px;
}

.world-subtitle {
    font-family: Inter, sans-serif;

    font-size: 18px;

    opacity: 0.95;

    margin-bottom: 36px;
}

.focus-btn {
    border: none;

    padding: 18px 34px;

    border-radius: 999px;

    background: white;

    color: #3d342d;

    font-size: 16px;

    font-weight: 500;

    cursor: pointer;

    transition: 0.3s;
}

.focus-btn:hover {
    transform: translateY(-3px);
}
.session-list {
    display: flex;
    flex-direction: column;
    gap: 14px;

    width: min(380px, 85vw);
}

.session-card {
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.12);

    backdrop-filter: blur(18px);

    border-radius: 28px;

    padding: 20px 24px;

    color: white;

    font-family: Inter, sans-serif;

    cursor: pointer;

    transition: 0.3s;
}

.session-card:hover {
    transform: translateY(-4px) scale(1.02);

    background: rgba(255,255,255,0.18);

    box-shadow:
        0 12px 30px rgba(0,0,0,0.15);
}
.session-title {
    letter-spacing: 0.2px;
    font-size: 18px;
    font-weight: 500;

    margin-bottom: 6px;
}

.session-info {
    font-size: 14px;

    opacity: 0.8;
}
</style>

</head>

<body>

<div class="world-page">

    <div class="top-bar">

       <a href="https://apak8990-cmyk.github.io/asmrstudying/website/" class="back-btn">
    ← Back
</a>
        <div class="stats">

            <div class="stat">
                Level 1
            </div>

            <div class="stat">
                0 Coins
            </div>

        </div>

    </div>

    <div class="center-content">

        <h1 class="world-title">
            Dream College Dorm
        </h1>

        <p class="world-subtitle">
            Your campus journey begins here.
        </p>

       <div class="session-list">

    <div class="session-card" onclick="startSession(25)">

    <div class="session-title">
        Morning Review
    </div>

    <div class="session-description">
        A gentle start to your academic day.
    </div>

    <div class="session-info">
        25 min • +10 coins
    </div>

</div>

    <div class="session-card" onclick="startSession(50)">
    <div class="session-title">
        Library Session
    </div>


<div class="session-description">
    Deep focus among the campus shelves.
</div>

<div class="session-info">
    50 min • +25 coins
</div>
</div>

    <div class="session-card" onclick="startSession(90)">
    <div class="session-title">
    Finals Preparation
</div>

<div class="session-description">
    Long-form study for ambitious goals.
</div>

<div class="session-info">
    90 min • +50 coins
</div>
</div>

</div>

    </div>

</div>


</body>
</html>
