<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Space Station</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background-image:
    linear-gradient(
        rgba(0,0,0,0.45),
        rgba(0,0,0,0.45)
    ),
    url("../images/spacestation.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;

    padding:20px;
}

.container{

    width:100%;
    max-width:520px;

    background:rgba(15,20,30,0.82);

    backdrop-filter:blur(14px);

    border-radius:32px;

    padding:32px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

h1{
    color:#BFD7EA;
    margin-bottom:10px;
}

.subtitle{
    color:#94A9C2;
    margin-bottom:30px;
}

#timer{
    font-size:64px;
    font-weight:bold;
    color:#E8F1FF;
    margin-bottom:25px;
}

#startBtn{

    background:#4B5D78;

    color:white;

    border:none;

    border-radius:18px;

    padding:14px 28px;

    cursor:pointer;

    font-size:16px;
}

.sounds{

    margin-top:30px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}

.sound-btn{

    border:none;

    border-radius:14px;

    padding:14px;

    background:#243247;

    color:white;

    cursor:pointer;
}

.back{

    display:inline-block;

    margin-top:30px;

    text-decoration:none;

    color:#BFD7EA;
}

</style>

</head>

<body>

<div class="container">

```
<h1>🚀 Space Station</h1>

<p class="subtitle">
    Drift through deep space and focus beyond the stars.
</p>

<div id="timer">25:00</div>

<button id="startBtn">
    Start
</button>

<div class="sounds">

    <button class="sound-btn">🚀 Engine Hum</button>

    <button class="sound-btn">💻 Computer Beeps</button>

    <button class="sound-btn">🌌 Deep Space</button>

    <button class="sound-btn">⚡ Reactor</button>

</div>

<a href="../index.html" class="back">
    ← Back to Worlds
</a>
```

</div>

<script src="../script.js"></script>

</body>
</html>
