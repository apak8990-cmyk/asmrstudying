<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>ASMR Studying</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<div class="hero">

    <div class="logo">
        ASMR STUDYING
    </div>

    <h1>
        Build Your Dream Study Space
    </h1>

    <p class="subtitle">
        Study, earn rewards, and transform your world into a place you'll never want to leave.
    </p>

</div>

<div class="worlds-grid">

    <div class="world-card" onclick="openWorld('dream-dorm.html')">

        <img src="images/dreamdorm.jpg" alt="Dream College Dorm">

        <div class="overlay">
            <h3>Dream College Dorm</h3>
            <p>Create the ultimate campus room.</p>
        </div>

    </div>

    <div class="world-card" onclick="openWorld('mars-pod.html')">

        <img src="images/marspod.jpg" alt="Mars Observation Pod">

        <div class="overlay">
            <h3>Mars Observation Pod</h3>
            <p>Study among the stars.</p>
        </div>

    </div>

    <div class="world-card" onclick="openWorld('treehouse.html')">

        <img src="images/treehouse.jpg" alt="Tree House Sanctuary">

        <div class="overlay">
            <h3>Tree House Sanctuary</h3>
            <p>Your hidden forest retreat.</p>
        </div>

    </div>

</div>

<script>

function openWorld(worldFile) {
    window.open('worlds/' + worldFile, '_blank');
}

</script>

</body>
</html>
