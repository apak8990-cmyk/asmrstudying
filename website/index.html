<!DOCTYPE html>
<html>
<head>

<title>ASMR Studying</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>✨ Choose Your Study World</h1>

    <h2>Free Worlds</h2>

    <div class="cards">

        <div class="card">
            📚
            <h3>Rainy Library</h3>
        </div>

        <div class="card">
            🌊
            <h3>Ocean View</h3>
        </div>

        <div class="card">
            🌃
            <h3>Tokyo Night</h3>
        </div>

    </div>

    <h2>Premium Worlds</h2>

    <div class="cards">

        <div class="card premium">
            🚀
            <h3>Space Station</h3>
        </div>

        <div class="card premium">
            🌸
            <h3>Sakura Garden</h3>
        </div>

    </div>

</div>

</html>
